<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Score Editor</title>
    <script src="http://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="./data.js"></script>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            margin:30px;
        }

        table{
            border-collapse: collapse;
            width:70%;
        }

        th,td{
            border:1px solid black;
            padding:8px;
            text-align:center;
        }

        th{
            background:#f2f2f2;
        }

        .editable{
            cursor:pointer;
            background:#fffbe6;
        }

        input[type=number]{
            width:60px;
        }
    </style>
</head>

<body>
    <h2>Student Score Table</h2>
    
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Midterm</th>
                <th>Final</th>
                <th>Total</th>
                <th>Grade</th>
            </tr>
        </thead>
    
        <tbody id="table-body">
    
        </tbody>
    
    </table>
    
    <script>

        $(document).ready(function () {

            function getGrade(total) {

                if (total >= 80) return "A";
                if (total >= 70) return "B";
                if (total >= 60) return "C";
                if (total >= 50) return "D";
                return "F";

            }

            function drawTable() {

                $("#table-body").empty();

                $.each(students, function (index, student) {

                    let total = student.midterm + student.final;

                    let grade = getGrade(total);

                    $("#table-body").append(`
                    <tr data-index="${index}">
                        <td>${student.id}</td>
                        <td>${student.name}</td>
    
                        <td class="editable" data-field="midterm">
                            ${student.midterm}
                        </td>
    
                        <td class="editable" data-field="final">
                            ${student.final}
                        </td>
    
                        <td class="total">${total}</td>
    
                        <td class="grade">${grade}</td>
                    </tr>
                `);

                });

            }

            drawTable();



            $(document).on("click", ".editable", function () {

                let cell = $(this);

                if (cell.find("input").length > 0)
                    return;

                let oldValue = cell.text().trim();

                cell.html(`
                <input
                    type="number"
                    min="0"
                    max="50"
                    value="${oldValue}">
            `);

                let input = cell.find("input");

                input.focus();

                input.select();



                input.on("keydown", function (e) {

                    if (e.key === "Enter") {

                        let value = parseInt($(this).val());

                        if (isNaN(value) || value < 0 || value > 50) {

                            alert("Score must be between 0 and 50");

                            cell.text(oldValue);

                            return;

                        }

                        let row = cell.closest("tr");

                        let index = row.data("index");

                        let field = cell.data("field");

                        students[index][field] = value;

                        let total =
                            students[index].midterm +
                            students[index].final;

                        let grade = getGrade(total);

                        cell.text(value);

                        row.find(".total").text(total);

                        row.find(".grade").text(grade);

                    }

                    if (e.key === "Escape") {

                        cell.text(oldValue);

                    }

                });



                input.on("blur", function () {

                    if (cell.find("input").length) {

                        cell.text(oldValue);

                    }

                });

            });

        });

    </script>
</body>
</html>
